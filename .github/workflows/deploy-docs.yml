name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "docs-content/**"
      - "website/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# All branch docs are written into one gh-pages branch, so serialize publishes.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    outputs:
      branch_path: ${{ steps.branch.outputs.branch_path }}
      base_url: ${{ steps.branch.outputs.base_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve branch path
        id: branch
        shell: bash
        run: |
          branch_path="${GITHUB_REF_NAME//\//-}"
          echo "branch_path=${branch_path}" >> "$GITHUB_OUTPUT"
          echo "base_url=/${branch_path}/" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docusaurus
        env:
          DOCUSAURUS_BASE_URL: ${{ steps.branch.outputs.base_url }}
        run: pnpm run build

      - name: Upload branch docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ steps.branch.outputs.branch_path }}
          path: website/build

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download branch docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-${{ needs.build.outputs.branch_path }}
          path: branch-build

      - name: Checkout Pages branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir pages
          cd pages
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin gh-pages; then
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update branch docs directory
        shell: bash
        run: |
          set -euo pipefail
          branch_path="${{ needs.build.outputs.branch_path }}"
          rm -rf "pages/${branch_path}"
          mkdir -p "pages/${branch_path}"
          cp -R branch-build/. "pages/${branch_path}/"
          rm -f "pages/${branch_path}/CNAME"

          if [ -f website/static/CNAME ]; then
            cp website/static/CNAME pages/CNAME
          fi
          touch pages/.nojekyll

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '  <title>RegistryLib Docs Versions</title>'
            echo '  <style>body{font-family:system-ui,-apple-system,sans-serif;margin:3rem;line-height:1.5}a{color:#2563eb}</style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>RegistryLib Docs Versions</h1>'
            echo '  <ul>'
            find pages -mindepth 1 -maxdepth 1 -type d ! -name .git -printf '%f\n' | sort -V | while read -r dir; do
              echo "    <li><a href=\"./${dir}/\">${dir}</a></li>"
            done
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } > pages/index.html

      - name: Commit and push Pages branch
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi
          git commit -m "Deploy docs for ${GITHUB_REF_NAME}"
          git push origin gh-pages
