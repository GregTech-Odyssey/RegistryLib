name: Gradle Package

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and check for conflicts
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: mod_version '${VERSION}' is not a valid x.x.x version number."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Checking version: ${VERSION}"

          # Check GitHub Release
          if gh release view "${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ERROR: GitHub Release '${VERSION}' already exists. Bump mod_version before publishing."
            exit 1
          fi
          echo "✓ GitHub Release '${VERSION}' is available."

          # Check GitHub Packages
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          GROUP_ID=$(grep '^mod_group_id=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MOD_ID=$(grep '^mod_id=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PKG_NAME="${GROUP_ID}.${MOD_ID}"
          HTTP_STATUS=$(curl -s -o /tmp/pkg_resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${OWNER}/packages/maven/${PKG_NAME}/versions")
          if [ "$HTTP_STATUS" = "200" ]; then
            if grep -q "\"${VERSION}\"" /tmp/pkg_resp.json; then
              echo "ERROR: GitHub Packages already has version '${VERSION}'."
              exit 1
            fi
          fi
          echo "✓ GitHub Packages version '${VERSION}' is available."

          # Check CurseForge
          CF_RESPONSE=$(curl -s \
            -H "x-api-key: ${CF_API_TOKEN}" \
            "https://minecraft.curseforge.com/api/projects/${CF_PROJECT_ID}/files")
          if echo "$CF_RESPONSE" | grep -q "\"${VERSION}\""; then
            echo "ERROR: CurseForge already has a file matching version '${VERSION}'."
            exit 1
          fi
          echo "✓ CurseForge version '${VERSION}' is available."

  build:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew line endings and permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build JAR
        run: ./gradlew assemble --stacktrace

      - name: List build outputs
        run: |
          echo "=== build/libs ==="
          ls -la build/libs/ 2>/dev/null || echo "build/libs does not exist"
          echo "=== all jars ==="
          find . -name "*.jar" -not -path "./.gradle/*" | sort

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-libs
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar

      - name: Publish to GitHub Packages
        run: ./gradlew publish --stacktrace
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-libs
          path: build/libs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          JARS=$(find build/libs -name "*.jar" | tr '\n' ' ')
          if [ -z "$JARS" ]; then
            echo "ERROR: No JAR files found in build/libs/"
            exit 1
          fi
          gh release create "${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${VERSION}" \
            --notes "Release ${VERSION}" \
            $JARS

  upload-curseforge:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-libs
          path: build/libs

      - name: Find main JAR
        id: find_jar
        run: |
          JAR=$(find build/libs -name "*.jar" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR found in build/libs/"
            exit 1
          fi
          echo "jar_path=${JAR}" >> "$GITHUB_OUTPUT"
          echo "Uploading: ${JAR}"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          game_versions: "26.1-snapshot,NeoForge,Java 25"
          file_path: ${{ steps.find_jar.outputs.jar_path }}
          display_name: ${{ needs.check-version.outputs.version }}
          release_type: release
          changelog: "Release ${{ needs.check-version.outputs.version }}"
          changelog_type: markdown