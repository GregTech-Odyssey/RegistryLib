name: Gradle Package

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Fix gradlew line endings and permissions
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Check version and set tag
      id: tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
        if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "ERROR: mod_version '${VERSION}' is not a valid x.x.x version number."
          exit 1
        fi
        TAG="${VERSION}"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "ERROR: Release '${TAG}' already exists. Bump mod_version in gradle.properties before publishing."
          exit 1
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Version check passed. Tag: ${TAG}"

    - name: Build JAR
      run: ./gradlew assemble --stacktrace

    - name: List build outputs
      run: |
        echo "=== build/libs ==="
        ls -la build/libs/ 2>/dev/null || echo "build/libs does not exist"
        echo "=== all jars ==="
        find . -name "*.jar" -not -path "./.gradle/*" | sort

    - name: Publish to GitHub Packages
      run: ./gradlew publish --stacktrace
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        JARS=$(find build/libs -name "*.jar" -not -name "*-dev.jar" -not -name "*-sources.jar" 2>/dev/null | tr '\n' ' ')
        if [ -z "$JARS" ]; then
          echo "ERROR: No JAR files found in build/libs/"
          exit 1
        fi
        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" \
          --notes "Automated release $TAG" \
          $JARS

    - name: Find main JAR for CurseForge
      id: find_jar
      run: |
        JAR=$(find build/libs -name "*.jar" -not -name "*-dev.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | head -n 1)
        if [ -z "$JAR" ]; then
          echo "ERROR: No main JAR found"
          exit 1
        fi
        echo "jar_path=${JAR}" >> "$GITHUB_OUTPUT"
        echo "Uploading to CurseForge: ${JAR}"

    - name: Upload to CurseForge
      uses: itsmeow/curseforge-upload@v3
      with:
        # Required: add CURSEFORGE_API_TOKEN to repository Secrets
        # Get your token from: https://www.curseforge.com/account/api-tokens
        token: ${{ secrets.CURSEFORGE_API_TOKEN }}
        # Required: add CURSEFORGE_PROJECT_ID to repository Variables (numerical ID from CurseForge project page sidebar)
        project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
        game_endpoint: minecraft
        game_versions: "26.1-snapshot,NeoForge,Java 25"
        file_path: ${{ steps.find_jar.outputs.jar_path }}
        display_name: ${{ steps.tag.outputs.tag }}
        release_type: release
        changelog: "Automated release ${{ steps.tag.outputs.tag }}"
        changelog_type: markdown