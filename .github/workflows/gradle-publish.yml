name: Gradle Package

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Determine release tag
      id: tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
        BUILD=1
        while gh release view "v${VERSION}-build${BUILD}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
          BUILD=$((BUILD + 1))
        done
        TAG="v${VERSION}-build${BUILD}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Resolved release tag: ${TAG}"

    - name: Build JAR
      run: ./gradlew assemble --stacktrace

    - name: List build outputs
      run: |
        echo "=== build/libs ==="
        ls -la build/libs/ 2>/dev/null || echo "build/libs does not exist"
        echo "=== all jars ==="
        find . -name "*.jar" -not -path "./.gradle/*" | sort

    - name: Publish to GitHub Packages
      run: ./gradlew publish --stacktrace
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        JARS=$(find build/libs -name "*.jar" -not -name "*-dev.jar" -not -name "*-sources.jar" 2>/dev/null | tr '\n' ' ')
        if [ -z "$JARS" ]; then
          echo "ERROR: No JAR files found in build/libs/"
          exit 1
        fi
        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" \
          --notes "Automated release $TAG" \
          $JARS